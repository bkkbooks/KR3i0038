body:
  text: 荔枝譜宋蔡襄撰第一荔枝之於天下唯閩粵南粵巴蜀有之漢初南粵王尉他以之備方物於是始通中國司馬相如賦上林云答遝離支蓋夸言之無有是也東京交址七郡貢生荔枝十里一置五里一堠晝夜奔騰有毒蟲猛獸之害臨武長唐羌上書言狀和帝詔太官省之魏文帝有西域蒲桃之比世譏其繆論豈當時南北斷隔所擬出於傳聞耶唐天寶中妃子尤愛嗜涪州歲命驛致時之詞人多所稱詠張九齡賦之以託意白居易刺忠州既形於詩又圖而序之雖髣佛顔色而甘滋之勝莫能著也洛陽取於嶺南長安來於巴蜀雖曰鮮獻而傳置之速腐爛之餘色香味之存者亡幾矣是生荔枝中國未始見之也九齡居易雖見新實驗今之廣南州郡與夔梓之間所出大率早熟肌肉薄而味甘酸其精好者僅比東閩之下等是二人者亦未始遇夫真荔枝者也閩中唯四郡有之福州最多而興化軍最為竒特泉漳時亦知名列品雖高而寂寥無紀將尤異之物昔所未有乎蓋亦有之而未始遇乎人也豫家莆陽再臨泉福二郡十年往還道由鄉國每得其尤者命工寫生稡集既多因而題目以為倡始夫以一木之實生於海瀕巖險之逺而能名徹上京外被重譯重於當世是亦有足貴者其於果品卓然第一然性畏髙寒不堪移殖而又道里遼絶曾不得班於盧橘江橙之右少發光采此所以為之嘆惜而不可不述也第二興化軍風俗園池勝處唯種荔枝當其熟時雖有他果不復見省尤重陳紫富室大家歲或不嘗雖别品千計不為滿意陳氏欲採摘必先閉户隔墻入錢度音鐸錢與之得者自以為幸不敢較其直之多少也今列陳紫之所長以例衆品其樹晚熟其實廣上而圓下大可徑寸有五分香氣清逺色澤鮮紫殼薄而平瓤厚而瑩膜如桃花紅核如丁香毋剝之凝如水精食之消如絳雪其味之至不可得而狀也荔枝以甘為味雖百千樹莫有同者過甘與淡失味之中唯陳紫之於色香味自拔其類此所以為天下第一也凡荔枝皮膜形色一有類陳紫則已為中品若夫厚皮尖刺肌理黃色附核而赤食之有查食已而澀雖無酢味自亦下等矣第三福州種殖最多延貤原野洪塘水西尤其盛處一家之有至於萬株城中越山當州署之北鬱為林麓暑雨初霽晚日照曜絳囊翠葉鮮明蔽映數里之間焜如星火非名畫之可得而精思之可述觀攬之勝無與為比初著花時商人計林斷之以立劵若後豐寡商人知之不計美惡悉為紅鹽去聲者水浮陸轉以入京師外至北漠西夏其東南舟行新羅日本流求大食之屬莫不愛好重利以酬之故商人販益廣而鄉人種益多一歲之出不知幾千萬億而鄉人得飫食者蓋鮮以其斷林鬻之也品目至衆唯江家緑為州之第一第四荔枝食之有益於人列仙傳稱有食其華實為荔枝仙人本草亦列其功葛洪云蠲渴補髓所以唐羌疏曰未必延年益壽蓋云雖有其傳豈果能哉亦諫止之詞也或以其性熱人有日噉千顆未嘗為疾即少覺熱以蜜漿解之其木堅理難老今有三百歲者枝葉繁茂生結不息此亦其驗也第五初種畏寒方五六年深冬覆之以護霜霰福州之西三舍曰水口地少加寒已不可殖大略其花春生蔌蔌然白色其色多少在風雨時與不時也有間歲生者謂之歇枝有仍歲生者半生半歇也春雨之際傍生新葉其色紅白六七月時色已變緑此明年開花者也今年實者明年歇枝也最忌麝香或遇之花實盡落其熟未經採摘蟲鳥皆不敢近或已取之蝙蝠蜂蟻爭來蠧食園家有名樹旁植四柱小樓夜棲其上以警盜者又破竹五七尺搖之答答然以逼蝙蝠之屬第六紅鹽去聲之法民間以鹽梅滷浸佛桑花為紅漿投荔枝漬之曝乾色紅而甘酸可三四年不蟲去聲修貢與商人皆便之然絶無正味白曬者正爾烈日乾之以核堅為止畜之甕中密封百日謂之出汗去去聲汗耐久不然踰歲壞矣福州舊貢紅鹽蜜煎二種慶厯初太官問歲進之狀知州事沈邈以道逺不可致減紅鹽之數而增白曬者兼令漳泉二郡亦均貢焉蜜煎剝生荔枝笮去其漿然後蜜煮之豫前知福州用曬及半乾者為煎色黃白而味美可愛其費荔枝減常歲十之六七然修貢者皆取於民後之主吏利其多取以責賂曬煎之法不行矣第七陳紫已下十二品有等次虎皮已下二十品無等次陳紫因治居第平窊坎而樹之或云厥土肥沃之致今傳其種子者皆擇善壤終莫能及是亦賦生之異也江緑大較類陳紫而差大獨香薄而味少淡故以次之其樹已賣葉氏而民間猶以為江家緑云方家紅可徑二寸色味俱美言荔枝之大者皆莫敢擬歲生一二百顆人罕得之方氏子名蓁今為大理寺丞遊家紫出名十年種自陳紫實大過之小陳紫其樹去陳紫數十步初一家并種之及其成也差小又時有􅧎核者因而得名其家别居二紫亦分屬東西陳焉宋公荔枝樹極髙大實如陳紫而小甘美無異或云陳紫種出宋氏世傳其樹已三百歲舊屬王氏黃巢兵過欲斧薪之王氏媪抱樹號泣求與樹偕死賊憐之不伐宋公名諴公者老人之稱年餘八十子孫皆仕宦藍家紅泉州為第一藍氏兄弟圭為太常博士丞為尚書都官員外郎周家紅獨立興化軍三十年後生益竒聲名乃損然亦不失為上等何家紅出漳州何氏世為牙校嘗有郡將全樹買之樹在舍後將熟其子日領卒數十人穿其堂房乃至樹所其來無時舉家伏藏欲即伐去而不忍今猶存焉法石白出泉州法石院色青白其大次於藍家紅緑核頗類江緑色丹而小荔枝皆紫核此以緑見異出福州圓丁香丁香荔枝皆旁去聲蒂大而下鋭此種體圓與味皆勝虎皮者紅色絶大繞腹有青紋正類虎斑嘗於福州東山大乘寺見之不知其出處牛心者以狀言之長二寸餘皮厚肉澀福州唯有一株每歲貢乾荔枝皆調於民主吏常以牛心為凖民倍直購之以輸豫嘗黜而不用玳瑁紅荔枝上有黑點踈密如玳瑁斑福州城東有之硫黃顔色正黃而刺微紅亦小荔枝以色名之也朱柿色如柿紅而扁大亦云朴柿出福州蒲桃荔枝穗生一朵至一二百將熟多破裂凡荔枝每顆一梗長三五寸附於枝此等附枝而生樂天所謂朵如蒲桃者正謂是也其品殊下蚶殼者殼為深渠如瓦屋焉龍牙者荔枝之變怪者其殼紅可長三四寸彎曲如爪牙而無瓤核全樹忽變非常有也興化軍轉運司廳事之西嘗見之水荔枝漿多而淡食之蠲渴荔枝宜依山或平陸有近水田者清泉流溉其味遂爾出興化軍蜜荔枝純甘如蜜是謂過甘失味之中丁香荔枝核如小丁香樹病或有之亦謂之􅧎核皆小實也大丁香出福州天慶觀厚殼紫色瓤多而味微澀雙髻小荔枝每朵數十皆並蒂雙頭因以目之真珠剖之純瓤圓白如珠荔枝之小者止於此十八娘荔枝色深紅而細長時人以少女比之俚傳閩王王氏有女第十八好噉此品因而得名其冢今在城東報國院冢旁猶有此樹云將軍荔枝五代間有為此官者種之後人以其官號其樹而失其姓名之傳出福州叉頭顆紅而小可間婦人女子簪翹之側故特貴之粉紅者荔枝多深紅而色淺者為異謂如傅朱粉之飾故曰粉紅中元紅荔枝將絶才熟以晚重於時豫嘗七月二十四日得之火山本出廣南四月熟味甘酸而肉薄穗生梗如枇杷閩中近亦有之山在梧州右三十二品言姓氏尤其著者也言州郡記所出也不言姓氏州郡四郡或皆有也荔枝譜
