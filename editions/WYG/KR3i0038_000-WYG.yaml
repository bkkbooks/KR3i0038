body:
  text: 提要荔枝譜譜録類三草木禽魚之屬臣等謹案荔枝譜一卷宋蔡襄撰襄字君謨興化仙游人天聖八年進士官至端明殿學士卒諡忠惠事蹟具宋史本傳是編為閩中荔枝而作凡七篇其一原本始其二標尤異其三誌賈鬻其四明服食其五慎䕶養其六時法製其七别種類嘗手寫刻之今尚有墨板傳於世亦載所著端明集中末有嘉祐四年嵗次己亥秋八月二十日莆陽葵某述十九字而此本無之按其年月葢自福州移知泉州時也荔枝之有譜自襄始其叙述特詳潔有筆力而王世貞四部稿乃謂白樂天蘇子瞻為荔枝傳神君謨不及殊非篤論又案襄詩篇中屢咏及荔枝多可與譜相參考者如四月池上一首荔枝纔似小青梅句劉克莊謂即譜中之火山又七月二十四日食荔枝一首絳衣仙子過中元句即譜中之中元紅又謝宋評事一首兵鋒却後知神物句即譜中之宋公荔枝又有與昭文相公手帖所謂陳家紫號第一輒獻左右者則集中不載别見於洪邁容齋隨筆亦可以備此譜故實云橘録譜録類三草木禽魚之屬臣等謹案橘録三卷宋韓彦直撰彦直字子温延安人蘄忠武王世忠之長子登紹興十八年進士官至龍圖閣學士提舉萬夀觀以光禄大夫致仕封蘄春郡公事蹟附見宋史世忠傳此譜乃淳熈中彦直知温州時所作宋史藝文志焦竑國史經籍志俱作永嘉橘録卷數與此本相合文獻通考作一卷葢字之誤也彦直有才畧而文學亦優嘗輯宋朝故事名水心鏡凡一百六十餘卷為尤袤所稱今不傳是録亦頗見條理上卷載柑品八橙品二中卷載橘品十八以泥山乳柑為第一下卷則言種植之法皆詳贍可觀陳景沂作全芳備祖引彦直此録謂其但知乳柑出於泥山而不知出於天台之黄巖出於泥山者固奇出於黄巖者尤天下之奇云云葢景沂家本天台故欲自夸飾土産不知彦直是録專記永嘉不當借材於異地也其亦昧於著作之體矣乾隆四十六年四月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:0862d1d83d12491dfabb7cd3950b23d3323fda758230aa037774a83d72c546a3
